name: onym-moderation-authority

# The authority behind Caddy, which terminates TLS and renews
# certificates automatically — the same shape as onym-infra and the
# sibling enforcement backend.
#
# Note what is *not* here: no Apple credentials, no device-mark
# anything. This service signs verdicts and cannot execute them. If a
# future edit gives it a write path to a device, the seat's separation
# is gone.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CADDY_EMAIL=${CADDY_EMAIL:-}
      - AUTHORITY_HOST=${AUTHORITY_HOST:-authority.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [authority]

  authority:
    build: .
    image: onym-moderation-authority:latest
    restart: unless-stopped
    environment:
      - AUTHORITY_BIND=0.0.0.0:8080
      - AUTHORITY_STORE_PATH=/data/authority.sqlite
      - AUTHORITY_MANIFEST_PATH=/manifest/manifest.json
      - AUTHORITY_SIGNING_SEED=${AUTHORITY_SIGNING_SEED:?set in .env}
      - AUTHORITY_INTERFACE_URL=${AUTHORITY_INTERFACE_URL:-}
      - AUTHORITY_INTERFACE_TOKEN=${AUTHORITY_INTERFACE_TOKEN:-}
      - AUTHORITY_INTERFACE_KEY=${AUTHORITY_INTERFACE_KEY:-}
      - AUTHORITY_MODERATOR_TOKEN=${AUTHORITY_MODERATOR_TOKEN:-}
      - AUTHORITY_ADMIN_TOKEN=${AUTHORITY_ADMIN_TOKEN:-}
      - AUTHORITY_DEADLINE_SWEEP_SECS=${AUTHORITY_DEADLINE_SWEEP_SECS:-300}
      # Triage. The URL points at the sibling container below, so
      # evidence never leaves this host.
      - AUTHORITY_TRIAGE_MODE=${AUTHORITY_TRIAGE_MODE:-off}
      - AUTHORITY_TRIAGE_URL=${AUTHORITY_TRIAGE_URL:-http://moderation-model:8000/v1/moderations}
      - AUTHORITY_TRIAGE_MODEL=${AUTHORITY_TRIAGE_MODEL:-mistral-moderation-latest}
      - AUTHORITY_TRIAGE_API_KEY=${AUTHORITY_TRIAGE_API_KEY:-}
      - AUTHORITY_TRIAGE_BAN_THRESHOLD=${AUTHORITY_TRIAGE_BAN_THRESHOLD:-0.9}
      - AUTHORITY_TRIAGE_DISMISS_THRESHOLD=${AUTHORITY_TRIAGE_DISMISS_THRESHOLD:-0.2}
      - AUTHORITY_TRIAGE_CATEGORY_MAP=${AUTHORITY_TRIAGE_CATEGORY_MAP:-}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # Cases, reports, reporter track records, and issued verdicts.
      # Losing this loses the record behind every mark the interface is
      # holding — and an accused person's evidence that a case existed.
      - authority-data:/data
      # The published manifest. Users' mandates pin the SHA-256 of
      # these exact bytes, so editing this file after anyone has
      # consented silently invalidates their mandates.
      - ./manifest:/manifest:ro
    networks: [internal]

  # The moderation model, on this host.
  #
  # Uncomment together with AUTHORITY_TRIAGE_MODE. It publishes no
  # ports: only the authority reaches it, over the private network, so
  # the evidence it reads never leaves the machine the user consented
  # to. That is the whole reason it is a sibling container rather than
  # an API key.
  #
  # The image is left to the operator because what can serve Mistral's
  # moderation shape depends on your licensing: Mistral's own
  # self-hosted offering, or any local server exposing
  # `POST /v1/moderations` with `{model, input}` and returning category
  # scores. The client accepts both documented response shapes.
  #
  # moderation-model:
  #   image: ${AUTHORITY_TRIAGE_IMAGE:?set AUTHORITY_TRIAGE_IMAGE in .env}
  #   restart: unless-stopped
  #   networks: [internal]
  #   volumes:
  #     - model-cache:/models
  #   # No `ports:` — deliberately unreachable from outside.

networks:
  internal:

volumes:
  caddy-data:
  caddy-config:
  authority-data:
  # model-cache:
