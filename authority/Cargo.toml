[package]
name = "onym-moderation-authority"
version = "0.1.0"
edition = "2021"
description = "Reference moderation authority for the Onym moderation seat"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["limit", "trace"] }
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Evidence images are attacker-supplied bytes, so the decoder surface is
# deliberately narrow: default features off, and only the two formats the
# allowlist accepts. Every other decoder this crate can build is one this
# authority will never be asked to run.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Drives the router directly in tests: every refusal below is exercised
# through the real handler stack, not a reimplementation of it.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
