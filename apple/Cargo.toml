[package]
name = "onym-moderation-apple"
version = "0.1.0"
edition = "2021"
description = "Enforcement backend for the Onym moderation seat, Apple DeviceCheck profile"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["limit", "trace"] }
base64 = "0.22"
hex = "0.4"
# rustls-tls keeps us off OpenSSL — the runtime image is debian:bookworm-slim
# without libssl, exactly as onym-relayer does it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# ES256 JWTs for the DeviceCheck API, signed with the vendor's .p8 key.
jsonwebtoken = "9"
# Ed25519 for user mandate/session signatures and the interface
# countersignature.
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# `bundled` compiles SQLite in, so the runtime image needs no libsqlite3.
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
